name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build release APK (debug-signed when no keystore secret)
        env:
          SB_KEYSTORE_B64: ${{ secrets.SB_KEYSTORE_B64 }}
          SB_KEYSTORE_PASSWORD: ${{ secrets.SB_KEYSTORE_PASSWORD }}
          SB_KEY_ALIAS: ${{ secrets.SB_KEY_ALIAS }}
          SB_KEY_PASSWORD: ${{ secrets.SB_KEY_PASSWORD }}
        run: |
          if [ -n "$SB_KEYSTORE_B64" ]; then
            echo "$SB_KEYSTORE_B64" | base64 -d > android/keystore/screenshot-brain.keystore
            cat > android/keystore.properties <<PROPS
          storeFile=keystore/screenshot-brain.keystore
          storePassword=$SB_KEYSTORE_PASSWORD
          keyAlias=$SB_KEY_ALIAS
          keyPassword=$SB_KEY_PASSWORD
          PROPS
          fi
          cd android
          ./gradlew assembleRelease

      - name: Rename artifacts
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle | head -1)
          cp android/app/build/outputs/apk/debug/app-debug.apk "ScreenshotBrain-v${VER}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "ScreenshotBrain-v${VER}.apk"
          ls -la ScreenshotBrain-*

      - name: Check if CI can sign a release APK
        if: startsWith(github.ref, 'refs/tags/')
        id: signing
        env:
          SB_KEYSTORE_B64: ${{ secrets.SB_KEYSTORE_B64 }}
        run: |
          if [ -n "$SB_KEYSTORE_B64" ]; then
            echo "attach=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No SB_KEYSTORE_B64 secret configured. CI built a debug-signed APK for validation only; it will NOT be attached to the public release. Releases are published from a local build signed with the production keystore."
            echo "attach=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach signed APKs to the release
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.attach == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScreenshotBrain-*.apk
          generate_release_notes: true
